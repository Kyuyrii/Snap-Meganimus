name: meganimus
base: core24
version: '5.8'
adopt-info: meganimus-app
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
grade: stable
confinement: strict
icon: io.github.kyuyrii.meganimus.png

apps:
  meganimus:
    command: usr/bin/meganimus
    desktop: usr/share/applications/io.github.kyuyrii.meganimus.desktop
    common-id: io.github.kyuyrii.meganimus
    environment:
      HOME: $SNAP_USER_COMMON
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$SNAP/lib/python3.12/site-packages:$PYTHONPATH
    extensions: [kde-neon-6]
    plugs:
      - home
      - removable-media

parts:
  meganimus-app:
    plugin: make
    source: https://github.com/Kyuyrii/Meganimus.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    parse-info: [metainfo/io.github.kyuyrii.meganimus.metainfo.xml]
    make-parameters:
      - PREFIX=/usr

  base-dependencies:
    plugin: python
    source: .
    stage-packages:
      - python3-pyqt6
      - python3-requests
      - python3-tomlkit
    python-packages:
      - qtawesome
    prime: [usr/lib/python3/dist-packages, lib/python3.12/site-packages]
